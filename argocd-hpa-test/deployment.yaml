apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-test
  labels:
    app: cpu-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-test
  template:
    metadata:
      labels:
        app: cpu-test
    spec:
      containers:
      - name: cpu-test
        image: nginx
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"
